name: F2.3 Embedding Classifier CPU tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  f2-embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pytorch-model.txt
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-pytorch-model.txt
      - name: Unit tests F2.1-F2.3
        run: python -m pytest -q tests/test_autograd.py tests/test_pytorch_data.py tests/test_embedding_classifier.py
      - name: Synthetic classifier smoke test
        run: python -m scripts.pytorch_classifier --synthetic --check
