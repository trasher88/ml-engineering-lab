name: F2.6 Training Diagnostics CPU tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  f2-training-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pytorch-diagnostics.txt
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-pytorch-diagnostics.txt
      - name: Unit tests F2.1-F2.6
        run: python -m pytest -q tests/test_autograd.py tests/test_pytorch_data.py tests/test_embedding_classifier.py tests/test_training_loop.py tests/test_validation_checkpoint.py tests/test_training_diagnostics.py
      - name: Synthetic diagnostics smoke
        run: python -m scripts.pytorch_diagnostics --synthetic --epochs 3 --check
