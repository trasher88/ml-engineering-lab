name: F2.7 Classical vs Neural CPU tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  f2-model-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pytorch-comparison.txt
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-pytorch-comparison.txt
      - name: F2.7 unit and regression tests
        run: python -m pytest -q tests/test_model_comparison.py tests/test_validation_checkpoint.py tests/test_pytorch_data.py
      - name: Synthetic paired comparison smoke
        run: python -m scripts.pytorch_comparison --synthetic --check
