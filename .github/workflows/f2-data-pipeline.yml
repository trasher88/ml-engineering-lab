name: F2.2 Dataset and DataLoader CPU tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  f2-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pytorch-data.txt
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-pytorch-data.txt
      - name: Unit tests F2.1 and F2.2
        run: python -m pytest -q tests/test_autograd.py tests/test_pytorch_data.py
      - name: Synthetic data pipeline smoke test
        run: python -m scripts.pytorch_batches --synthetic --check
