name: F2.4 Training Loop CPU tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  f2-training-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pytorch-training.txt
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-pytorch-training.txt
      - name: Unit tests F2.1-F2.4
        run: python -m pytest -q tests/test_autograd.py tests/test_pytorch_data.py tests/test_embedding_classifier.py tests/test_training_loop.py
      - name: Synthetic training smoke test
        run: python -m scripts.pytorch_training --synthetic --check
