name: Foundation F1 tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install F1.1-F1.9 dependencies
        run: python -m pip install -r requirements-error-analysis.txt
      - name: F1.1-F1.9 offline unit tests
        run: python -m pytest -q tests/test_foundation.py tests/test_provenance.py tests/test_ingestion.py tests/test_cleaning.py tests/test_eda.py tests/test_splitting.py tests/test_classical.py tests/test_error_analysis.py tests/test_f1_report.py
      - name: Check pinned dataset metadata (offline)
        run: python -m src.data.provenance
